[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collars"
version = "0.1.0"
description = "Collars Under the Microscope: reset timing luck and strike design in a systematic put-spread collar."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "yfinance>=0.2.40",
    "qcore",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
